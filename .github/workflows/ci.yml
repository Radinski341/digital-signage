name: Restaurant platform checks
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: restaurant_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/restaurant_test
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/restaurant_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/restaurant_test
      NEXTAUTH_URL: http://localhost:3100
      NEXTAUTH_SECRET: isolated-ci-only-secret-never-for-production
      E2E_PASSWORD: IsolatedCiOnlyTestPassword42
      PLAYWRIGHT_START_SERVER: "1"
      RAYON_NUM_THREADS: "1"
      NODE_OPTIONS: --max-old-space-size=4096
      OPENAI_API_KEY: isolated-test-key-never-sent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run db:generate
      - run: npm run db:deploy
      - run: npx prisma db seed
      - run: npm run theme:reference
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:fixtures
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: |
            playwright-report
            test-results
